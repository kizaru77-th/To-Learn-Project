<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* 1. กำหนดค่าเริ่มต้นให้ตัวอักษร */
    .text-hover-effect {
            background-color: #66a6d1;
            border-radius: 100px;
            color: white;
            padding: 8px 20px; 
            width: 30%;     
            display: flex;     
            justify-content: space-between; 
            align-items: center;
            border: none;
            cursor: pointer;
            font-family: 'Prompt', sans-serif;
            box-sizing: border-box;
            background-image: linear-gradient(135deg, #1E3A8A, #3B82F6);
            background-size: 0% 100%;
            background-repeat: no-repeat;
            background-position: center;
            text-decoration: none;
            font-size: 18px;
            text-align: center;
            border: 2px solid black;
            box-shadow: 1px 1px 0px black;
            transition: background-size 0.5s ease, transform 0.3s ease, color 0.3s ease;
        }
        .text-hover-effect:hover {
            background-size: 100% 100%;
            color: white;
            transform: scale(1.05);
        }

    .button-group {
        display: flex;
        gap: 15px;
        justify-content: center;
        margin-top: 50px;
    }

    .nav-button {
        text-decoration: none;
        padding: 10px 25px;
        background-color: #78bbe8;
        color: white;
        border-radius: 12px;
        border: 2px solid #000;
        font-family: 'Prompt', sans-serif;
        transition: 0.3s;
    }

    .nav-button:hover {
        background-color: #ffda44;
        color: black;
        transform: translateY(-3px);
    }
  </style>
</head>
<body>
    <div class="button-group">
        <a href="mainweb.html" class="nav-button">🏠 หน้าหลัก</a>
        <a href="timer.html" class="nav-button">⏱️ ตัวจับเวลา</a>
        <a href="login.html" class="nav-button">🔑 เข้าสู่ระบบ</a>
        <a href="test2.html" class="nav-button">🔑 test</a>
    </div>
</body>
</html>
