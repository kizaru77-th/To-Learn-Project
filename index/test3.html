<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <style>
    body { margin: 0; background: #ffffff; overflow-x: hidden; }
    
    /* กล่องใบที่ 1 */
    #b { 
      position: absolute; 
      left: 35%; /* ขยับไปทางซ้าย */
      margin-left: -75px; 
      width: 150px; 
      height: 220px; 
      background: #000000; 
      border-radius: 8px 8px 0 0; 
    }

    /* กล่องใบที่ 2 (ขนาดต่างกัน) */
    #b2 { 
      position: absolute; 
      left: 65%; /* ขยับไปทางขวา จะได้ไม่ทับกัน */
      margin-left: -50px; 
      width: 100px;  /* ความกว้างใหม่ */
      height: 150px; /* ความสูงใหม่ */
      background: #000000; 
      border-radius: 8px 8px 0 0; 
    }
    #b4 { 
      position: absolute; 
      left: 80%; /* ขยับไปทางขวา จะได้ไม่ทับกัน */
      margin-left: 00px; 
      width: 100px;  /* ความกว้างใหม่ */
      height: 200px; /* ความสูงใหม่ */
      background: #000000; 
      border-radius: 12px 12px 0 0; 
    }
    #b3 { 
      position: absolute; 
      left: 85%; /* ขยับไปทางขวา จะได้ไม่ทับกัน */
      margin-left: 0px; 
      width: 150px;  /* ความกว้างใหม่ */
      height: 300px; /* ความสูงใหม่ */
      background: #686868; 
      border-radius: 12px 12px 0 0; 
    }
  </style>
</head>
<body>

<div id="b"></div>
<div id="b2"></div> <!-- เพิ่มกล่องที่สองตรงนี้ -->
<div id="b3"></div> <!-- เพิ่มกล่องที่สามตรงนี้ -->
<div id="b4"></div>


<div style="height: 600vh;"></div>

<script>
  // เก็บค่ากำหนดและสถานะฟิสิกส์ของกล่องทั้งสองใบไว้ใน Array
  const boxes = [
    {
      element: document.getElementById('b'),
      height: 220,
      y: window.innerHeight - 220,
      v: 0,
      gravity: 0.6,
      bounce: -0.35
    },
    {
      element: document.getElementById('b2'),
      height: 150, // ต้องตรงกับความสูงใน CSS
      y: window.innerHeight - 150,
      v: 0,
      gravity: 0.8, // ปรับให้หนักขึ้นเล็กน้อยเพื่อให้ความรู้สึกต่างกัน
      bounce: -0.45 // ปรับให้เด้งดึ๋งกว่าเดิมเล็กน้อย
    },
    {
      element: document.getElementById('b4'),
      height: 200, // ต้องตรงกับความสูงใน CSS
      y: window.innerHeight - 200,
      v: 0,
      gravity: 1, // ปรับให้หนักขึ้นเล็กน้อยเพื่อให้ความรู้สึกต่างกัน
      bounce: -0.45 // ปรับให้เด้งดึ๋งกว่าเดิมเล็กน้อย
    },
    {
      element: document.getElementById('b3'),
      height: 300, // ต้องตรงกับความสูงใน CSS
      y: window.innerHeight - 300,
      v: 0,
      gravity: 0.8, // ปรับให้หนักขึ้นเล็กน้อยเพื่อให้ความรู้สึกต่างกัน
      bounce: -0.45 // ปรับให้เด้งดึ๋งกว่าเดิมเล็กน้อย
    }
  ];

  (function loop() {
    // ใช้ Loop เพื่อคำนวณฟิสิกส์ของกล่องแต่ละใบแยกกัน
    boxes.forEach(box => {
      // เป้าหมายที่วัตถุควรจะอยู่ (คำนวณตามความสูงของกล่องนั้นๆ)
      let ty = window.scrollY + window.innerHeight - box.height;

      if (box.y < ty || Math.abs(box.v) > 0.1) {
        box.v += box.gravity; 
        box.y += box.v;

        // เมื่อวัตถุกระแทกพื้นของตัวเอง
        if (box.y >= ty) {
          box.y = ty;
          box.v *= box.bounce; 
        }
      } else {
        // เมื่อวัตถุอยู่นิ่งแล้ว ให้ขยับตาม Scroll แบบนุ่มนวล (Easing)
        box.y += (ty - box.y) * 0.15; 
        box.v = 0;
      }

      // นำค่าตำแหน่งที่คำนวณได้ไปสั่งให้ Element ขยับ
      box.element.style.top = box.y + "px";
    });

    requestAnimationFrame(loop);
  })();
</script>

</body>
</html>
