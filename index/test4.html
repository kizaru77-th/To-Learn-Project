<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Droplet Progress Bar with Splash</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .progress-container {
            width: 30px;
            height: 300px;
            background-color: #f5f5f5;
            border-radius: 15px;
            position: relative;
            border: 1px solid #eaeaea;
        }

        /* --- NEW: SPLASH EFFECT (Left & Right ripples) --- */
        /* Creating the splash particles using pseudo-elements so HTML stays clean */
        .progress-container::before,
        .progress-container::after {
            content: '';
            position: absolute;
            bottom: 0;
            width: 8px;
            height: 8px;
            background-color: #000000;
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
        }
        /* Left particle initial positioning */
        .progress-container::before { left: -4px; }
        /* Right particle initial positioning */
        .progress-container::after { right: -4px; }

        /* Class triggered by JS to run the splash animation */
        .splash-active::before {
            animation: splashLeft 0.4s ease-out forwards;
        }
        .splash-active::after {
            animation: splashRight 0.4s ease-out forwards;
        }

        @keyframes splashLeft {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(-20px, -15px) scale(0.3); opacity: 0; }
        }

        @keyframes splashRight {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(20px, -15px) scale(0.3); opacity: 0; }
        }
        /* ------------------------------------------------- */

        .progress-bar {
            width: 100%;
            background-color: #000000;
            position: absolute;
            bottom: 0;
            left: 0;
            border-radius: 15px;
            height: 0%; 
        }

        .loading {
            animation: fillUp 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes fillUp {
            from { height: 0%; border-radius: 0 0 14px 14px; }
            to { height: 100%; border-radius: 14px; }
        }

        .draining {
            animation: drain 1s ease-out forwards;
        }

        @keyframes drain {
            from { height: 100%; border-radius: 14px; }
            to { height: 0%; border-radius: 0 0 14px 14px; }
        }

        /* The Water Droplet */
        .droplet {
            position: absolute;
            width: 14px;
            height: 14px;
            background-color: #000000;
            border-radius: 0 50% 50% 50%;
            transform: rotate(90deg); 
            top: -15px;
            left: 8px;
            opacity: 0;
            pointer-events: none;
        }

        .shoot-up {
            animation: splashLoop 1s cubic-bezier(0.5, 0.2, 0, 0.2) forwards;
        }

        @keyframes splashLoop {
            0% {
                transform: translateY(20px) rotate(45deg) scale(1);
                opacity: 1;
            }
            /* Peak of the jump */
            50% {
                transform: translateY(20px) rotate(45deg) scale(0.9);
                opacity: 1;
            }
            /* Falling back down through the container */
            99% {
                transform: translateY(300px) rotate(45deg) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(300px) rotate(45deg) scale(1);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="progress-container" id="mainContainer">
        <div class="progress-bar loading" id="progressBar"></div>
        <div class="droplet" id="droplet"></div>
    </div>

    <script>
        const progressBar = document.getElementById('progressBar');
        const droplet = document.getElementById('droplet');
        const mainContainer = document.getElementById('mainContainer');

        // Phase 1: Bar finishes filling -> start draining and shoot droplet
        progressBar.addEventListener('animationend', (event) => {
            if (event.animationName === 'fillUp') {
                progressBar.classList.remove('loading');
                progressBar.classList.add('draining');
                droplet.classList.add('shoot-up');
            }
        });

        // Phase 2: Droplet hits the very bottom floor of the container
        droplet.addEventListener('animationend', () => {
            // 1. Clean up droplet classes
            droplet.classList.remove('shoot-up');
            
            // 2. Trigger the splash animation on the container
            mainContainer.classList.add('splash-active');

            // 3. Wait briefly for the splash animation to finish before resetting the bar
            setTimeout(() => {
                // Remove the splash class so it can be re-triggered next loop
                mainContainer.classList.remove('splash-active');
                
                // Reset the progress bar
                progressBar.classList.remove('draining');
                void progressBar.offsetWidth; // Force browser reflow
                progressBar.classList.add('loading');
            }, 400); // 400ms matches the exact duration of the splash animations
        });
    </script>

</body>
</html>
