    <script>
        const openMenuBtn = document.getElementById('openMenuBtn');
        const closeMenuBtn = document.getElementById('closeMenuBtn');
        const sidebarMenu = document.getElementById('sidebarMenu');
        const menuOverlay = document.getElementById('menuOverlay');
        
        // ประกาศตัวแปรสำหรับ คอร์สเรียน
        const courseBtn = document.getElementById('courseBtn');
        const courseContent = document.getElementById('courseContent');

        // ประกาศตัวแปรสำหรับ ติดต่อเรา
        const contactBtn = document.getElementById('contactBtn');
        const contactContent = document.getElementById('contactContent');

        // ฟังก์ชันสั่งเปิดเมนูข้าง
        openMenuBtn.addEventListener('click', () => {
            sidebarMenu.classList.add('active');
            menuOverlay.classList.add('active');
        });

        // ฟังก์ชันสั่งปิดเมนูข้าง
        closeMenuBtn.addEventListener('click', () => {
            sidebarMenu.classList.remove('active');
            menuOverlay.classList.remove('active');
        });

        // ฟังก์ชันสั่งปิดเมนูข้างเมื่อกดพื้นที่ว่าง
        menuOverlay.addEventListener('click', () => {
            sidebarMenu.classList.remove('active');
            menuOverlay.classList.remove('active');
        });

        // ── 🛠️ ฟังก์ชันคลิกปุ่มคอร์สเรียน ──
        courseBtn.addEventListener('click', () => {
            courseContent.classList.toggle('open');
            courseBtn.classList.toggle('active');
        });

        // ── ฟังก์ชันคลิกปุ่มติดต่อเรา ──
        contactBtn.addEventListener('click', () => { 
            contactContent.classList.toggle('open');
            contactBtn.classList.toggle('active');
        });

         const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('show');
                } else {
                    entry.target.classList.remove('show');
                }
            });
        }, {
        threshold: 0.15 
        });

        const popupElements = document.querySelectorAll('.popup');
        popupElements.forEach((element) => observer.observe(element));

        // --- ระบบตรวจสอบการล็อกอิน ---
        function checkLoginStatus() {
            console.log("ชื่อที่ดึงมาได้คือ:", localStorage.getItem('username'));
            console.log("ลิงก์รูปที่ดึงมาได้คือ:", localStorage.getItem('profilePicture'));
            const authSection = document.getElementById('auth-section');
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            const username = localStorage.getItem('username') || 'ผู้ใช้งาน';
            const profilePicture = localStorage.getItem('profilePicture');
            
            // ตรวจสอบว่ามีรูปโปรไฟล์ใน localStorage หรือไม่ ถ้าไม่มีให้ใช้รูปเริ่มต้น
            const displayImage = profilePicture ? profilePicture : 'img/Sample_User_Icon.png';

    if (isLoggedIn === 'true') {
        authSection.innerHTML = `
            <a href="profile_upload.php" style="display: block; text-decoration: none; border: none !important; background: none !important; box-shadow: none !important; cursor: pointer;">
                <img src="${displayImage}" class="user-profile-circle" alt="Profile Cover" title="คลิกเพื่อเปลี่ยนรูปโปรไฟล์">
            </a>
            <div style="font-weight: 600; color: #333; margin-bottom: 5px; word-break: break-word;">${username}</div>
            <button onclick="showLogoutConfirm()" style="color: #ff4d4d; font-size: 12px; cursor: pointer; border: none; background: none; text-decoration: underline;">ออกจากระบบ</button>
        `;

        // ค้นหาทุกลิงก์ที่เคยไปหน้า login.html และเปลี่ยนให้ไปหน้า mainweb.html แทน
        const loginLinks = document.querySelectorAll('a[href="login.html"]');
        loginLinks.forEach(link => {
            link.href = 'mainweb.html';
            if (link.innerText.trim() === 'ลงชื่อเข้าใช้') {
                link.innerText = 'เข้าสู่หน้าหลัก';
            }
        });
    }
    }

    // Function to check login status before accessing certain pages
    function checkAccess(targetPage) {
        if (localStorage.getItem('isLoggedIn') === 'true') {
            window.location.href = targetPage;
        } else {
        window.location.href = 'access_denied_popup.html';
    }
    }

    function logout() {
        localStorage.removeItem('isLoggedIn');
        localStorage.removeItem('username');
        localStorage.removeItem('profilePicture'); // ลบรูปโปรไฟล์ออกจาก localStorage ด้วย
        window.location.href = 'index.html'; // เปลี่ยนเส้นทางไปหน้า Tolearn.html
    }

    // --- ฟังก์ชัน popup ยืนยันการออกจากระบบ ---
    function showLogoutConfirm() {
        const modal = document.getElementById('logout-modal');
        if (modal) modal.style.display = 'flex';
    }
    function cancelLogout() {
        const modal = document.getElementById('logout-modal');
        if (modal) modal.style.display = 'none';
    }
    function performLogout() {
        logout();
    }

        // เรียกใช้งานเมื่อโหลดหน้าเว็บ
        window.onload = checkLoginStatus;
        // เรียกใช้งานเมื่อโหลดหน้าเว็บ
        window.onload = checkLoginStatus;
        window.onload = checkLoginStatus;
        const INACTIVITY_TIME = 10 * 60 * 1000; 
        let timeoutId;

        // ฟังก์ชันสำหรับเตะผู้ใช้กลับหน้าหลัก
        function redirectToHome() {
            window.location.href = 'index.html'; 
        }

        // ฟังก์ชันรีเซ็ตเวลานับถอยหลังใหม่
        function resetTimer() {
        // ลบเวลาเก่าทิ้งไปก่อน
        clearTimeout(timeoutId);
    
        // เริ่มนับเวลา 10 นาทีใหม่อีกครั้ง
        timeoutId = setTimeout(redirectToHome, INACTIVITY_TIME);
        }

        // ฟังก์ชันสำหรับเริ่มจับตาดูพฤติกรรมของผู้ใช้
        function setupInactivityTimer() {
            // ดักฟังเหตุการณ์ต่างๆ (ขยับเมาส์, คลิก, กดปุ่มคีย์บอร์ด, หรือทัชหน้าจอ)
            window.addEventListener('mousemove', resetTimer);
            window.addEventListener('click', resetTimer);
            window.addEventListener('keydown', resetTimer);
            window.addEventListener('touchstart', resetTimer); // รองรับมือถือ/แท็บเล็ต

            // เริ่มต้นนับเวลาครั้งแรกทันทีที่โหลดหน้าเว็บเสร็จ
            resetTimer();
        }

        // เรียกใช้งานฟังก์ชันเมื่อหน้าเว็บโหลดเสร็จ
        document.addEventListener('DOMContentLoaded', setupInactivityTimer);
    </script>

    <!-- Logout confirmation popup modal -->
    <div id="logout-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:2000;align-items:center;justify-content:center;">
        <div style="background:white;padding:30px;border-radius:15px;max-width:350px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,0.3);animation:slideIn 0.3s ease;">
            <p style="font-size:18px;margin:0 0 20px 0;font-weight:600;color:#333;">คุณแน่ใจว่าจะออกจากระบบหรือไม่?</p>
            <div style="display:flex;gap:12px;justify-content:center;">
                <button onclick="cancelLogout()" style="padding:10px 24px;border-radius:8px;border:1px solid #ddd;background:#f5f5f5;color:#333;font-weight:500;cursor:pointer;font-family:'Prompt',sans-serif;transition:all 0.3s ease;" onmouseover="this.style.background='#e8e8e8'" onmouseout="this.style.background='#f5f5f5'">กลับไปหน้าเดิม</button>
                <button onclick="performLogout()" style="padding:10px 24px;border-radius:8px;border:none;background:#ff4d4d;color:white;font-weight:500;cursor:pointer;font-family:'Prompt',sans-serif;transition:all 0.3s ease;" onmouseover="this.style.background='#ff3333'" onmouseout="this.style.background='#ff4d4d'">ออกจากระบบ</button>
            </div>
        </div>
    </div>

    <style>
        @keyframes slideIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
