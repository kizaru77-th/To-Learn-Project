<!DOCTYPE html>
<html lang="th">
<head>
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าถึงสิทธิ์ประโยชน์ - ToLearn</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            margin: 0;
            padding: 0;
            background-image: linear-gradient(to top, #cbffdc , skyblue);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Prevent scrollbars */
            background-image: url("img/ToLearnBG.jpg");
            background-size: 100% 100%;
        }
        .popup-container {
            background-color: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
            width: 90%;
            animation: fadeInScale 0.5s ease-out forwards;
        }
        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }
        p {
            color: #555;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn-group a {
            display: inline-block;
            padding: 12px 25px;
            border-radius: 100px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            margin: 0 10px;
            border: 2px solid black;
            box-shadow: 1px 1px 0px black;
        }
        .btn-group a.login-btn {
            background-color: #7c86e1;
            color: white;
            background-image: linear-gradient(to bottom right, rgb(217, 255, 0), rgb(188, 255, 186));
            background-size: 0% 100%;
            background-repeat: no-repeat;
            background-position: left;
            transition: background-color 0.5s ease, color 0.5s ease, transform 0.5s ease;
        }
        .btn-group a.login-btn:hover {
            background-size: 100% 100%;
            color: black;
            filter: brightness(1.1);
            transform: translateY(-2px);
        }
        .btn-group a.back-btn {
            background-color: #f0f0f0;
            color: #333;
            background-image: linear-gradient(to bottom right, #9BF8F4, #6F7BF7);
            background-size: 0% 100%;
            background-repeat: no-repeat;
            transition: background-color 0.5s ease, color 0.5s ease, transform 0.5s ease;
        }
        .btn-group a.back-btn:hover {
            background-size: 100% 100%;
            color: black;
            filter: brightness(1.1);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="popup-container">
        <h1>กรุณาลงทะเบียนเพื่อเข้าถึงสิทธิ์ประโยชน์ของ ToLearn</h1>
        <p>คุณต้องลงชื่อเข้าใช้เพื่อใช้งานฟังก์ชันนี้</p>
        <div class="btn-group">
            <a href="login.html" class="login-btn">ลงชื่อเข้าใช้</a>
            <a href="mainweb.html" class="back-btn">กลับหน้าหลัก</a>
        </div>
    </div>
    <script>
        // เรียกใช้งานเมื่อโหลดหน้าเว็บ
        window.onload = checkLoginStatus;
        window.onload = checkLoginStatus;
        const INACTIVITY_TIME = 10 * 60 * 1000; 
        let timeoutId;

        // ฟังก์ชันสำหรับเตะผู้ใช้กลับหน้าหลัก
        function redirectToHome() {
            window.location.href = 'index.html'; 
        }

        // ฟังก์ชันรีเซ็ตเวลานับถอยหลังใหม่
        function resetTimer() {
        // ลบเวลาเก่าทิ้งไปก่อน
        clearTimeout(timeoutId);
    
        // เริ่มนับเวลา 10 นาทีใหม่อีกครั้ง
        timeoutId = setTimeout(redirectToHome, INACTIVITY_TIME);
        }

        // ฟังก์ชันสำหรับเริ่มจับตาดูพฤติกรรมของผู้ใช้
        function setupInactivityTimer() {
            // ดักฟังเหตุการณ์ต่างๆ (ขยับเมาส์, คลิก, กดปุ่มคีย์บอร์ด, หรือทัชหน้าจอ)
            window.addEventListener('mousemove', resetTimer);
            window.addEventListener('click', resetTimer);
            window.addEventListener('keydown', resetTimer);
            window.addEventListener('touchstart', resetTimer); // รองรับมือถือ/แท็บเล็ต

            // เริ่มต้นนับเวลาครั้งแรกทันทีที่โหลดหน้าเว็บเสร็จ
            resetTimer();
        }

        // เรียกใช้งานฟังก์ชันเมื่อหน้าเว็บโหลดเสร็จ
        document.addEventListener('DOMContentLoaded', setupInactivityTimer);
    </script>
</body>
</html>
